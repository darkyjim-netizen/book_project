<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>결제 실패</title>
  <style>
    body { font-family: "Malgun Gothic", sans-serif; background: #f5f6f8; margin: 0; padding: 48px 16px; }
    main { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 32px; }
    h1 { font-size: 22px; margin: 0 0 16px; color: #d93025; }
    dl { margin: 0 0 24px; }
    dt { font-size: 13px; color: #6b7280; margin-top: 12px; }
    dd { margin: 4px 0 0; font-size: 15px; word-break: break-all; }
    a { display: inline-block; padding: 10px 18px; border-radius: 8px; background: #3182f6; color: #fff; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>결제가 완료되지 않았습니다</h1>
    <dl>
      <dt>사유</dt>
      <dd>{{ error_message }}</dd>
      <dt>오류 코드</dt>
      <dd>{{ error_code }}</dd>
      {% if order_id %}
      <dt>주문번호</dt>
      <dd>{{ order_id }}</dd>
      {% endif %}
    </dl>
    <a href="{{ frontend_url }}">쇼핑몰로 돌아가기</a>
  </main>
</body>
</html>
